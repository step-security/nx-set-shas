name: NPM Audit Fix Run

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Use --force flag for npm audit fix?"
        required: true
        type: boolean
      base_branch:
        description: "Specify a base branch"
        required: false
        default: "v4.3.0-main"
      script:
        description: "Build script to bundle the action"
        required: false
        default: "yarn build"
      package_manager:
        description: "Package manager to use"
        required: false
        default: "yarn"
      node_version:
        description: "Node.js version to use"
        required: false
        default: "24"

  schedule:
    - cron: "0 0 * * 1"

jobs:
  audit-fix:
    uses: step-security/reusable-workflows/.github/workflows/audit_fix.yml@v1
    with:
      force: ${{ inputs.force || false }}
      base_branch: ${{ inputs.base_branch || 'v4.3.0-main' }}
      script: ${{ inputs.script }}
      package_manager: ${{ inputs.package_manager }}
      node_version: ${{ inputs.node_version || '24' }}

permissions:
  contents: write
  pull-requests: write
  packages: read
  issues: write
