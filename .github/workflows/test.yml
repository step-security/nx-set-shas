name: "Test"

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    strategy:
      matrix:
        runs-on: ${{ fromJson(github.actor == 'dependabot[bot]' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout [Pull Request]
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout [Push]
        if: ${{ github.event_name != 'pull_request' }}
        with:
          fetch-depth: 0

      - name: Set Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install
        run: yarn --frozen-lockfile

      - name: Compile
        run: yarn build

      - name: Test default PR Workflow
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          main-branch-name: ${{ github.base_ref }}
      - name: Verify default PR Workflow
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA=$(echo $(git merge-base origin/${{github.base_ref}} HEAD))
          HEAD_SHA=$(git rev-parse HEAD)
          node -e "if(process.env.NX_BASE == '${BASE_SHA}') console.log('Base set correctly'); else { throw new Error('Base not set correctly!');}"
          node -e "if(process.env.NX_HEAD == '${HEAD_SHA}') console.log('Head set correctly'); else { throw new Error('Head not set correctly!');}"

      - name: Test default Push Workflow
        if: github.event_name != 'pull_request'
        uses: ./
        with:
          main-branch-name: ${{ github.ref_name }}
      - name: Verify default Push Workflow
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git merge-base --is-ancestor $NX_BASE HEAD; then
            BASE_SHA=$NX_BASE;
          else
            BASE_SHA="";
          fi
          HEAD_SHA=$(echo $(git rev-parse HEAD))
          node -e "if(process.env.NX_BASE == '${BASE_SHA}') console.log('Base set correctly'); else { throw new Error('Base not set correctly!');}"
          node -e "if(process.env.NX_HEAD == '${HEAD_SHA}') console.log('Head set correctly'); else { throw new Error('Head not set correctly!');}"
